extends: base.yaml
# Stage 2: Repeat2 inputs (2 x 512 tokens), adds the tokenwise provenance head
# and the window-level mixed-authorship head.
train:
  output_dir: runs/stage2
  stage: 2
  steps: 5000
  batch_size: 4
  grad_accum: 4
  lr: 1.0e-4
  head_lr: 1.0e-3
  warmup_ratio: 0.03
  eval_every: 250
  save_every: 500
  log_every: 25
  w_segment: 1.0
  w_token: 1.0
  w_mixed: 0.5
  w_humanizer: 0.25
