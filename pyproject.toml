[project]
name = "ouroboros-detector"
version = "0.7.0"
description = "Open, token-level AI-text detector: human / AI-assisted / AI-generated. An unofficial reimplementation of the Pangram 4 technical report (arXiv:2607.27183)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "peft>=0.14",
    "huggingface_hub>=0.30",
    "datasets>=3.2",
    "accelerate>=1.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "rapidfuzz>=3.11",
    "sentence-transformers>=3.4",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "typer>=0.15",
    "rich>=13.9",
    "regex>=2024.11",
    "requests>=2.32",
    "py3langid>=0.4.0",
]

[project.scripts]
ouroboros = "ouroboros.cli:app"

[project.optional-dependencies]
demo = ["gradio>=6.0"]
train = ["tensorboard>=2.18"]
api = ["openai>=1.60"]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ouroboros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
